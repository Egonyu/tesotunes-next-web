name: CI

# The PR gate. Deliberately does not touch the network or any deployed API, so
# it gives a reliable signal on every pull request. End-to-end coverage lives in
# playwright-artist-images.yml, which needs a real API and is run on demand.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time only. No real secrets and no calls to a live API: the build
      # must never depend on production being reachable.
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-build-secret
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      API_URL: http://127.0.0.1:8000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npx next build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory-only for now: production dependencies still carry known issues
      # that need breaking upgrades (the auth cluster). Flip continue-on-error
      # to false once those land so regressions actually fail the build.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev
        continue-on-error: true
